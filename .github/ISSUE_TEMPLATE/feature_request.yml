name: Idea
description: Something the bar should be able to do
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out, or be told about?
      description: |
        The problem, not the solution. Squirrel exists because "I came back eleven minutes
        after it finished" is a problem; "add a timer segment" is one answer to it.
    validations: {required: true}
  - type: textarea
    id: today
    attributes:
      label: What do you do about it today?
